<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>觀察員卡</title>
<style>
/* 兩個畫面同一頁：#fill 手機填卡、#board 大螢幕便利貼牆。說＝琥珀、聽＝鋼藍，四幕四色。 */
:root{--bg:#FBFAF8;--card:#fff;--ink:#12161C;--ink2:#3B4450;--ink3:#606B79;--rule:#CFD6DF;--panel:#F0F2F5;--say:#8A5D0A;--saybg:#FBF3E3;--hear:#1B5480;
--m1:#2F5FA8;--m2:#A8322D;--m3:#1B6E52;--m4:#6B3F94;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;font-weight:700;margin-bottom:4px} .sub{color:var(--ink3);font-size:14px;margin-bottom:16px}
label{display:block;font-size:14px;color:var(--ink2);margin:14px 0 6px}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--say);outline-offset:1px}
.lens{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.lens button{font:inherit;padding:12px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.lens button[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--mc)}
.m1{--mc:var(--m1)} .m2{--mc:var(--m2)} .m3{--mc:var(--m3)} .m4{--mc:var(--m4)}
.watch{margin:10px 0 0 18px;color:var(--ink2);font-size:15px} .watch li{margin-bottom:4px}
.round{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.round button{font:inherit;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);font-size:15px;cursor:pointer}
.round button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.submit{width:100%;margin-top:22px;padding:14px;font:inherit;font-size:17px;font-weight:700;color:#FFF7E6;background:var(--say);border:0;border-radius:8px;cursor:pointer}
.submit:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:15px;color:var(--ink2);min-height:1.5em} .msg.ok{color:var(--m3)} .msg.err{color:var(--m2)}
.mine{font-size:13px;color:var(--ink3);margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}
/* ===== 大螢幕 ===== */
.board{max-width:none;padding:18px 24px}
.board header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.board h1{font-size:26px} .board .sub{margin:0}
.board .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.board .ctl button{font:inherit;padding:6px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);cursor:pointer}
.board .ctl button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--mc);border-radius:8px;padding:12px 16px 14px;min-height:40vh;display:flex;flex-direction:column}
.card h2{font-size:20px;display:flex;align-items:baseline;gap:10px} .card h2 small{font-size:13px;color:var(--ink3);font-weight:400;margin-left:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;flex:1}
.col h3{font-size:13px;letter-spacing:.08em;color:var(--ink3);margin-bottom:6px}
.col.good h3{color:var(--m3)} .col.better h3{color:var(--m2)}
.wall{display:flex;flex-direction:column;gap:6px;min-height:120px;padding:2px 0}
.note{background:var(--nbg);border-left:4px solid var(--mc);border-radius:4px;padding:7px 10px;font-size:15px;line-height:1.4;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.note.big{font-size:17px;font-weight:600}
.note .n{flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--mc);border-radius:10px;padding:1px 7px;margin-top:2px}
.note.new{animation:pop .5s ease-out both}
.col.good .note{--nbg:#EAF4EF} .col.better .note{--nbg:#FBEDEC}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.home{margin-top:8px;border-top:1px dashed var(--rule);padding-top:6px;font-size:14px;color:var(--ink2)}
.home b{color:var(--ink3);font-weight:600;font-size:12px;letter-spacing:.08em;display:block;margin-bottom:4px}
.home .wall{flex-direction:row;flex-wrap:wrap;min-height:0;gap:6px} .home .note{--nbg:var(--saybg);border-left-color:var(--say);font-size:14px}
.empty{color:var(--ink3);font-size:14px;align-self:center}
.foot{margin-top:10px;font-size:13px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap}
.qr{position:fixed;right:18px;bottom:14px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 8px 6px;text-align:center;font-size:12px;color:var(--ink2);box-shadow:0 2px 8px rgba(18,22,28,.08)}
.qr img{display:block;width:132px;height:132px}
@media (max-width:900px){.grid{grid-template-columns:1fr} .card{min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== 手機填卡 ===== -->
<main class="wrap" id="fill">
<h1>觀察員卡</h1>
<div class="sub">病安溝通工作坊・說與聽　每輪演完各填一次，短的就好。</div>

<label>你看哪一幕</label>
<div class="lens" id="lensPick"></div>
<ol class="watch" id="watch"></ol>

<label for="group">第幾組</label>
<select id="group"><option value="">請選</option><option>1</option><option>2</option><option>3</option><option>4</option></select>

<label>這是第幾輪</label>
<div class="round" id="roundPick"><button type="button" data-r="1" aria-pressed="true">第一輪</button><button type="button" data-r="2" aria-pressed="false">第二輪</button></div>

<label for="good">做得好的地方</label>
<textarea id="good" maxlength="80" placeholder="一句話"></textarea>
<label for="better">可以做得更好的地方</label>
<textarea id="better" maxlength="80" placeholder="一句話"></textarea>
<label for="home">帶回去的一句話（第二輪填）</label>
<input id="home" maxlength="60" placeholder="可留空">

<button class="submit" id="send" type="button">送出</button>
<div class="msg" id="msg" aria-live="polite"></div>
<div class="mine" id="mine"></div>
</main>

<!-- ===== 大螢幕 ===== -->
<main class="wrap board" id="board" hidden>
<header>
<h1>觀察員卡・便利貼牆</h1>
<div class="sub">病安溝通工作坊・說與聽</div>
<div class="ctl">
<span>顯示</span>
<button type="button" data-rf="1" aria-pressed="true">第一輪</button>
<button type="button" data-rf="2" aria-pressed="false">第二輪</button>
<button type="button" data-rf="0" aria-pressed="false">兩輪</button>
<span id="count"></span>
</div>
</header>
<div class="grid" id="grid"></div>
<div class="foot"><span id="status">連線中</span><span>手機掃右下角 QR 填卡</span></div>
<div class="qr"><img alt="填卡 QR code" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMYAAADGCAIAAAAG+WgKAAAEAUlEQVR4nO3dMW7jSBBAUc9ib6Bgor3/wSbaQGfwHIAJQfzuLhnvxR7Z0ny0UCDZ/ev7+/sLOv+ErwWSomeVIiYpYpIiJilikiImKWKSIiYpYpIi9u+dH3r9/u/rnPf/fx78Pdd/dcf1lZ+9TvUZPnvv69z5NKxSxCRFTFLEJEVMUpyY+K6qOWjdZPTMujnxvewTm/Z/YZUiJilikiImKWKSYsbEd3ZSu3Plq5rdnv09d+y8UrlzcrRKEZMUMUkRkxQxSTF14tvp7J2N66a51/j3dYdVipikiEmKmKSISYrYR0581axUTVjPrjC+lj0zeJZVipikiEmKmKSISYqpE9/ZaaWaAZ/dL3r9mdf4/VXWsUoRkxQxSRGTFDFJMWPiOzvRPLs6tvMuync0OT67VniWVYqYpIhJipikiEmK2K9PPIG9ekpu2r4orx9xn6dVipikiEmKmKSISYoTE9+z61M7771ctxPmzuuAZ58ZrD4xqxQxSRGTFDFJEZMUn/Mc352n255NK584XV5NO0e++sSsUsQkRUxSxCRFTFKcmPh2XkVaNwfdse63v6PZtnrv696pVYqYpIhJipikiEmKn3VX5x3T9ldZ9/lU1k2F7urkAF98xCRFTFLEJMWMnVvO7ip5dpfLdXuwvI5OzdWcaJUiJilikiImKWKSYurEd7XuOuD8a47vH/Eunv0uqxQxSRGTFDFJEZMUn3yN79krT7tr8c7rzD/Xz8THx/DFR0xSxCRFTFKc2Lll59NtZ3dlqf7Ve+NMum5nTju3MIIvPmKSIiYpYpJi6ukM0+423HliwvzTGa7WTdZWKSTFbFYpYpIiJilm3NV5Ne20u3XXsNZdd3tF8+bOezivrFLEJEVMUsQkRUxSfM5dnVdndyY5e5b6Tmfvp7VKEZMUMUkRkxQxSTH1BPazpw/M37nlFV2/mzZdXlmliEmKmKSISYqYpPhZ5/FNO1lv2lnqO7nGx1C++IhJipikiEmKqc/x7bRzLvup1xyfcR4fB/jiIyYpYpIiJilmPMe307prfJWzzwy+lz1TaecWRvDFR0xSxCRFTFLMOJ1h2ql5lere1HXXJedfc7RKEZMUMUkRkxQxSTH1PL6d+//vfP5u3Xx3x7p7U9dN1lYpYpIiJilikiImKT7nBPZ1ds53z37mHU2y6/7mdfedWqWISQpJMZtVipikiH3kxHd2F9Czd7S+l52UYa9OhvLFR0xSxCRFTFJMnfh2Pl/27Ny6s6fGvx79PTvnOzu3MJQvPmKSIiYpYpJixsQ3bW/Mna989oS+18bZ7RmrFDFJEZMUMUkRkxSxjzyPj8msUsQkRUxSxCRFTFLEJEVMUsQkRUxSxCRFTFJ8tf4CJlYcUayKnOEAAAAASUVORK5CYII="><div>掃碼填觀察員卡</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
/* ---- 設定：部署時填 ---- */
var SUPABASE_URL = "https://etbjnrshazilcayttosf.supabase.co";
var SUPABASE_ANON = "sb_publishable_bYq55a5SCglEfO8ipKrtfQ_Mey5vUj0";
var EVENT = "2026-11-07";

var LENSES = [
  { id:1, name:"Speak up", color:"m1", watch:["主護第二次講的時候，有沒有把病人意識不清、不能餵這兩件事一起講清楚","PGY 還是說吃早餐，主護有沒有再找人（護理長、主治），還是就照做了","餵食之前，有沒有人停下來"] },
  { id:2, name:"急救交班", color:"m3", watch:["交班有沒有講到早上血糖 40 沒補、叫不醒、已經餵過","接的人有沒有複述一次，還是只回一句好","主治到場時有沒有再交班一次，把早上的經過和插管時發現口鼻都是食物一起講清楚"] },
  { id:3, name:"病情解釋", color:"m2", watch:["主治有沒有照時間順序把早上的經過講清楚，餵食那一段有沒有講","有沒有用年紀大、併發症這種話帶過","有沒有跟女兒談要不要停止急救；有沒有講接下來怎麼處理、誰會跟家屬聯絡"] },
  { id:4, name:"跨世代溝通", color:"m4", watch:["護理長第一句是先關心人，還是先問你怎麼會這樣做","問的是發生了什麼事，還是一直問為什麼不","有沒有講她哪裡做對了；後續怎麼做，是不是一起討論出來的"] }
];
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var sb = null;
try{ if(window.supabase && SUPABASE_URL.indexOf("http")===0) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }catch(e){}

var isBoard = location.hash === "#board";
el("fill").hidden = isBoard; el("board").hidden = !isBoard;
window.addEventListener("hashchange", function(){ location.reload(); });

/* ================= 填卡 ================= */
if(!isBoard){
  var lens = 0, round = 1;
  try{ lens = +localStorage.getItem("obs:lens") || 0; var g = localStorage.getItem("obs:group"); if(g) el("group").value = g; }catch(e){}
  var lp = el("lensPick");
  LENSES.forEach(function(L){ var b=document.createElement("button"); b.type="button"; b.className=L.color; b.textContent="第 "+L.id+" 幕 "+L.name; b.setAttribute("aria-pressed", L.id===lens?"true":"false"); b.addEventListener("click", function(){ lens=L.id; try{ localStorage.setItem("obs:lens", lens); }catch(e){} renderLens(); }); lp.appendChild(b); });
  function renderLens(){ Array.prototype.forEach.call(lp.children, function(b,i){ b.setAttribute("aria-pressed", LENSES[i].id===lens?"true":"false"); }); var L = LENSES.filter(function(x){return x.id===lens;})[0]; el("watch").innerHTML = L ? L.watch.map(function(w){return "<li>"+esc(w)+"</li>";}).join("") : ""; }
  renderLens();
  var rp = el("roundPick");
  Array.prototype.forEach.call(rp.children, function(b){ b.addEventListener("click", function(){ round = +b.dataset.r; Array.prototype.forEach.call(rp.children, function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); }); }); });
  el("group").addEventListener("change", function(){ try{ localStorage.setItem("obs:group", this.value); }catch(e){} });
  function showMine(){ var m=[]; try{ m = JSON.parse(localStorage.getItem("obs:sent")||"[]"); }catch(e){} el("mine").innerHTML = m.length ? "你已送出 "+m.length+" 筆："+m.map(function(x){return "第 "+x.r+" 輪・第 "+x.l+" 幕";}).join("、") : ""; }
  showMine();
  el("send").addEventListener("click", async function(){
    var msg = el("msg"), good = el("good").value.trim(), better = el("better").value.trim(), home = el("home").value.trim(), group = el("group").value;
    msg.className="msg";
    if(!lens){ msg.className="msg err"; msg.textContent="先選你看的那一幕。"; return; }
    if(!group){ msg.className="msg err"; msg.textContent="選一下第幾組。"; return; }
    if(!good && !better && !home){ msg.className="msg err"; msg.textContent="至少寫一欄。"; return; }
    if(!sb){ msg.className="msg err"; msg.textContent="這份還沒接上資料庫，先用紙本。"; return; }
    this.disabled = true; msg.textContent="送出中…";
    try{
      var r = await sb.from("obs_cards").insert({ event: EVENT, lens: lens, grp: +group, round: round, good: good, better: better, home: home });
      if(r.error) throw r.error;
      msg.className="msg ok"; msg.textContent="收到了。第 "+round+" 輪・第 "+lens+" 幕。";
      el("good").value=""; el("better").value=""; el("home").value="";
      try{ var m = JSON.parse(localStorage.getItem("obs:sent")||"[]"); m.push({r:round,l:lens}); localStorage.setItem("obs:sent", JSON.stringify(m)); }catch(e){}
      showMine();
    }catch(e){ msg.className="msg err"; msg.textContent="沒送出去，再按一次。（"+esc(e.message||e)+"）"; }
    this.disabled = false;
  });
}

/* ================= 大螢幕 ================= */
if(isBoard){
  var rows = [], roundFilter = 1, seen = {};
  var grid = el("grid");
  LENSES.forEach(function(L){ var c=document.createElement("section"); c.className="card "+L.color; c.id="card"+L.id;
    c.innerHTML = '<h2><span>第 '+L.id+' 幕・'+esc(L.name)+'</span><small id="n'+L.id+'"></small></h2><div class="cols"><div class="col good"><h3>做得好</h3><div class="wall" id="g'+L.id+'"></div></div><div class="col better"><h3>可以做得更好</h3><div class="wall" id="b'+L.id+'"></div></div></div><div class="home"><b>帶回去的一句話</b><div class="wall" id="h'+L.id+'"></div></div>';
    grid.appendChild(c); });
  var ctl = el("board").querySelectorAll(".ctl button");
  ctl.forEach(function(b){ b.addEventListener("click", function(){ roundFilter = +b.dataset.rf; ctl.forEach(function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); }); render(); }); });

  // 便利貼牆：一則回答一張；文字正規化後相同的疊成一張標 ×N，多的排前面
  function norm(s){ return (s||"").replace(/[\s，,。．.、；;：:！!？?（）()「」『』\[\]【】\-—～~／/]+/g,"").toLowerCase(); }
  function wall(elm, texts, maxN){
    var groups = {}, order = [];
    texts.forEach(function(t){ t = (t||"").trim(); if(!t) return; var k = norm(t); if(!k) return; if(!groups[k]){ groups[k] = {text:t, n:0}; order.push(k); } groups[k].n += 1; });
    order.sort(function(a,b){ return groups[b].n - groups[a].n; });
    if(!order.length){ elm.innerHTML = '<span class="empty">還沒有人填</span>'; return; }
    var top = groups[order[0]].n;
    elm.innerHTML = order.slice(0, maxN).map(function(k){ var g = groups[k]; var isNew = !seen[elm.id+"|"+k]; seen[elm.id+"|"+k] = 1; return '<div class="note'+(g.n>1 && g.n===top ? " big" : "")+(isNew ? " new" : "")+'"><span>'+esc(g.text)+'</span>'+(g.n>1 ? '<span class="n">×'+g.n+'</span>' : '')+'</div>'; }).join("")
      + (order.length > maxN ? '<div class="empty">還有 '+(order.length-maxN)+' 則</div>' : '');
  }
  function render(){
    var vis = rows.filter(function(r){ return roundFilter===0 || r.round===roundFilter; });
    el("count").textContent = "共 "+vis.length+" 筆";
    LENSES.forEach(function(L){ var rs = vis.filter(function(r){ return r.lens===L.id; });
      el("n"+L.id).textContent = rs.length+" 筆";
      wall(el("g"+L.id), rs.map(function(r){return r.good;}), 12);
      wall(el("b"+L.id), rs.map(function(r){return r.better;}), 12);
      wall(el("h"+L.id), rows.filter(function(r){ return r.lens===L.id && r.home; }).map(function(r){return r.home;}), 8);
    });
  }
  render();
  async function load(){
    if(!sb){ el("status").textContent = "還沒接上資料庫"; return; }
    var r = await sb.from("obs_cards").select("id,lens,grp,round,good,better,home").eq("event", EVENT).order("id");
    if(r.error){ el("status").textContent = "讀取失敗："+r.error.message; return; }
    rows = r.data || []; render(); el("status").textContent = "已連線・"+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
  }
  load();
  if(sb){
    sb.channel("obs").on("postgres_changes", { event:"INSERT", schema:"public", table:"obs_cards" }, function(p){ if(p.new && p.new.event===EVENT){ rows.push(p.new); render(); } }).subscribe();
    setInterval(load, 15000); // 備援：realtime 掉了也會補
  }
}
})();
</script>
</body>
</html>
